# DiffGuard on GitLab merge requests (this repository installs itself from source;
# other projects use the snippet in docs/gitlab.md).
diffguard:
  stage: test
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_DEPTH: "0"
  script:
    - pip install --quiet .
    - diffguard scan --base "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --fail-on never
        -o json=diffguard.json -o markdown=diffguard.md
    - diffguard gate diffguard.json --fail-on high
  artifacts:
    when: always
    paths:
      - diffguard.json
      - diffguard.md
    expire_in: 30 days
