[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffguard-scan"
dynamic = ["version"]
description = "Risk triage and security checks for pull requests: scans only what a change adds or removes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mostapha EL ANSARI"}]
requires-python = ">=3.10"
dependencies = [
    "tomli>=1.1; python_version < '3.11'",
]
keywords = ["security", "code-review", "pull-request", "sast", "ci", "diff", "secrets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/mostaphaelansari/Feature-to-Production-Autonomous-Flow"
Issues = "https://github.com/mostaphaelansari/Feature-to-Production-Autonomous-Flow/issues"
Changelog = "https://github.com/mostaphaelansari/Feature-to-Production-Autonomous-Flow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "jsonschema>=4.20",
    "build>=1.0",
]

[project.scripts]
diffguard = "diffguard.cli:main"

[tool.setuptools.dynamic]
version = {attr = "diffguard.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Rule patterns and their examples are long by nature.
"src/diffguard/rules.py" = ["E501"]
# Inline diffs in tests read better unwrapped.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# DiffGuard scanning its own repository: the rule catalogue and the test corpus
# contain deliberately vulnerable example code.
[tool.diffguard]
fail-on = "high"
per-path-ignores = { "src/diffguard/rules.py" = ["*"], "tests/**" = ["*"] }
